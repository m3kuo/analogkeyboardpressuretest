<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Analog Pressure Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      
      <div class="doc-meta">
        
        <p>Hall Effect Keyboard Text Editor</p>
      </div>
    </div>

    <div class="topbar-right">
      <button id="connectBtn">Connect Keyboard</button>
      <span id="status">Not connected</span>
    </div>
  </header>

  <main class="app-shell">
    <div class="toolbar-shell">
      <div id="toolbar">
        <label id="pressureLabel">Pressure: <span id="pressureValue">0</span>%</label>
      </div>
    </div>

    <div class="page-shell">
      <div
        id="editor"
        contenteditable="true"
        spellcheck="false"
        aria-label="Document editor"
      >
Start typing... (Use your analog keyboard to change formatting by press force)
      </div>
    </div>

    <p class="note">
      Behavior: Full press = normal, Medium press = bold, Light press = italics.
      If no analog device is connected, the app still works but will use the last known pressure.
    </p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
